name: MPV AO clock diagnostic (not product acceptance)
run-name: AO clock counters — ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpv-clock-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Counter-only x86_64 build and original device gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAESTRO_VERSION: 2.8.0
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install exact JS dependencies and host build tools
        env:
          HUSKY: '0'
          NODE_ENV: development
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y ninja-build gperf pkg-config python3-venv
          python3 -m venv "$RUNNER_TEMP/mpv-build-tools"
          "$RUNNER_TEMP/mpv-build-tools/bin/pip" install meson==1.6.1 Jinja2
          echo "$RUNNER_TEMP/mpv-build-tools/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.1.12297006' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build isolated counter library (never assemble a product AAR)
        run: |
          python3 native/mpv/diagnostics/build_trace.py --work-dir "$RUNNER_TEMP/mpv-clock" --sdk "$ANDROID_HOME" > "$RUNNER_TEMP/trace-build.log" 2>&1
      - name: Build real debug target and instrumented fixture
        working-directory: android
        run: |
          bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
      - name: Verify one payload change and matching debug signatures
        run: |
          python3 native/mpv/diagnostics/package_apk.py --app android/app/build/outputs/apk/debug/app-x86_64-debug.apk --test android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk --library "$RUNNER_TEMP/mpv-clock/output/x86_64/libmpv-DIAGNOSTIC-ONLY.so" --build-info "$RUNNER_TEMP/mpv-clock/diagnostic-build.json" --sdk-tools "$ANDROID_HOME/build-tools/36.0.0" --output "$RUNNER_TEMP/clock-results/diagnostic.apk"
      - name: Build focus helper and install the existing device runner
        run: |
          bash e2e/focus-app/build.sh "$RUNNER_TEMP/clock-focus.apk"
          echo "E2E_FOCUS_APK=$RUNNER_TEMP/clock-focus.apk" >> "$GITHUB_ENV"
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Collect actual AO counts and raw positions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: bash native/mpv/diagnostics/run_device.sh "$RUNNER_TEMP/clock-results/diagnostic.apk" android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/clock-results"
      - name: Associate AO reads; apply the original clock gate
        if: always()
        run: python3 native/mpv/diagnostics/analyze_trace.py "$RUNNER_TEMP/clock-results"
      - name: Preserve diagnostic evidence (no APK or release publishing)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpv-clock-trace-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/clock-results/*.json
            ${{ runner.temp }}/clock-results/*.jsonl
            ${{ runner.temp }}/clock-results/*.log
            ${{ runner.temp }}/clock-results/*.txt
            ${{ runner.temp }}/clock-results/product-check/
            ${{ runner.temp }}/mpv-clock/diagnostic-build.json
            ${{ runner.temp }}/mpv-clock/producer/
            ${{ runner.temp }}/mpv-clock/output/x86_64/libmpv-DIAGNOSTIC-ONLY.so
            ${{ runner.temp }}/trace-build.log
