# ISOLATED DIAGNOSTIC BRANCH ONLY. Never merge this workflow over the product gate.
name: Player gesture observation (diagnostic only)
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        required: true
        default: '40252050369'
        type: string
      expected_apk_commit:
        required: true
        default: d775c352f2cf0b5b838d65840a0e567bd3605d7f
        type: string
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAESTRO_VERSION: '2.8.0'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v8
        with:
          pattern: beta-apks-*
          path: apk
          merge-multiple: true
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - name: Validate reused APK and native probe
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_apk_commit }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          commit=$(sed -n 's/^Commit: //p' apk/android-build-info.txt | head -n 1)
          test "$commit" = "$EXPECTED_COMMIT"
          (cd apk && sha256sum -c SHA256SUMS.txt)
          shopt -s nullglob
          apks=(apk/*x86_64-release.apk)
          test ${#apks[@]} -eq 1
          echo "E2E_APK=${apks[0]}" >> "$GITHUB_ENV"
          echo "E2E_APK_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "E2E_APK_SOURCE=reused Beta run $APK_RUN_ID" >> "$GITHUB_ENV"
          bash e2e/gesture-probe/build.sh "$RUNNER_TEMP/gesture-probe.apk"
          echo "E2E_GESTURE_PROBE_APK=$RUNNER_TEMP/gesture-probe.apk" >> "$GITHUB_ENV"
          PYTHONDONTWRITEBYTECODE=1 python3 -I e2e/gesture-probe/test_inspect.py
          sha256sum "$RUNNER_TEMP/gesture-probe.apk"
      # Diagnostic121 spent its entire 30-minute job downloading ~100 apt
      # packages/recommendations and never reached a device. Use one immutable,
      # checksum-pinned host tool archive, not a different App or a weaker gate.
      - name: Prepare pinned video tools
        timeout-minutes: 6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-video-tools.tar.xz"
          curl -fsSL --connect-timeout 20 --max-time 240 --retry 1 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-25-13-00/ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1.tar.xz \
            -o "$archive"
          echo "3300aa8c1d68e79e20d22117d3748a6121a49fe09b7eece3dcc38b84a1104e71  $archive" | sha256sum -c -
          python3 - "$archive" "$RUNNER_TEMP/mf-video-tools" <<'PYTOOLS'
          import os, shutil, sys, tarfile
          from pathlib import Path, PurePosixPath
          out = Path(sys.argv[2]); out.mkdir()
          found = set()
          with tarfile.open(sys.argv[1], 'r|xz') as archive:
              for member in archive:
                  path = PurePosixPath(member.name)
                  if path.name not in {'ffmpeg', 'ffprobe'} or path.parent.name != 'bin':
                      continue
                  if not member.isfile() or path.name in found or path.is_absolute() or '..' in path.parts:
                      raise SystemExit('invalid pinned tool archive')
                  with archive.extractfile(member) as source, (out / path.name).open('wb') as target:
                      shutil.copyfileobj(source, target)
                  os.chmod(out / path.name, 0o755); found.add(path.name)
          if found != {'ffmpeg', 'ffprobe'}: raise SystemExit('missing pinned video tools')
          PYTOOLS
          "$RUNNER_TEMP/mf-video-tools/ffmpeg" -version > "$RUNNER_TEMP/ffmpeg-version.txt"
          "$RUNNER_TEMP/mf-video-tools/ffprobe" -version > "$RUNNER_TEMP/ffprobe-version.txt"
          sed -n '1p' "$RUNNER_TEMP/ffmpeg-version.txt" "$RUNNER_TEMP/ffprobe-version.txt"
          echo "$RUNNER_TEMP/mf-video-tools" >> "$GITHUB_PATH"
      - name: Install Maestro
        timeout-minutes: 6
        run: |
          curl -fsSL --connect-timeout 20 --max-time 120 https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe actual held gestures
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_SUITE: gesture-observation
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: bash e2e/run.sh "$E2E_APK" "$GITHUB_SHA" e2e-results
      - name: Upload raw observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gesture-observation-${{ github.run_id }}
          path: e2e-results
          if-no-files-found: error
          retention-days: 14
