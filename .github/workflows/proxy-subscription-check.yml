name: Proxy and subscription regression checks

on:
    pull_request:
        paths:
            - 'android/app/src/main/java/fun/upup/musicfree/network/**'
            - 'android/app/src/test/java/fun/upup/musicfree/network/**'
            - 'android/app/src/androidTest/java/fun/upup/musicfree/network/**'
            - 'src/components/base/appBar.tsx'
            - 'src/pages/setting/settingTypes/pluginSetting/index.tsx'
            - 'e2e/flows/plugin-*.yaml'
            - 'e2e/proxy-subscription-check.sh'
            - '.github/workflows/proxy-subscription-check.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: proxy-subscription-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    emulator:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            HUSKY: '0'
            NODE_ENV: development
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: gradle
            - run: npm ci --no-audit --no-fund
            - name: Build debug app and native test APK
              working-directory: android
              run: |
                  chmod +x gradlew
                  ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest \
                    -PreactNativeArchitectures=x86_64 \
                    --no-daemon --max-workers=2 \
                    -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
            - name: Install Maestro
              run: |
                  curl -fsSL https://get.maestro.mobile.dev | bash
                  echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Check native proxy routing and record subscription transition
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 36
                  target: google_apis
                  arch: x86_64
                  profile: pixel_6
                  cores: 3
                  ram-size: 4096M
                  disable-animations: false
                  emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
                  script: bash e2e/proxy-subscription-check.sh
            - name: Upload native reports and transition recordings
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: proxy-subscription-${{ github.run_id }}
                  path: |
                      proxy-subscription-results/
                      android/app/build/reports/tests/
                      android/app/build/test-results/
                      android/app/build/reports/androidTests/
                      android/app/build/outputs/androidTest-results/
                  if-no-files-found: ignore
                  retention-days: 14
