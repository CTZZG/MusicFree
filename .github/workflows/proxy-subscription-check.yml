name: MV P0 evidence recovery (diagnostic branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41278370119'
          pattern: mv-p0-api*-41278370119
          path: original
      - name: Extract compact evidence without rerunning a device or build
        run: |
          python3 - <<'SCRIPT'
          from pathlib import Path
          import hashlib,json,shutil
          src=Path('original');dst=Path('compact');dst.mkdir()
          manifest={}
          for p in src.rglob('*'):
              if not p.is_file():continue
              rel=p.relative_to(src);manifest[str(rel)]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
              target=dst/rel;target.parent.mkdir(parents=True,exist_ok=True)
              if p.name=='logcat.txt':
                  shutil.copy2(p,target)
                  selected=[]
                  with p.open(errors='replace') as lines:
                      for line in lines:
                          if any(term in line for term in ['mvprobe','MFMv','AndroidRuntime','TextureView','SurfaceView','KeyguardViewMediator','HardwareRenderer']):selected.append(line)
                  target.with_name('filtered-logcat.txt').write_text(''.join(selected))
              elif p.suffix in ['.json','.jsonl','.png','.txt'] and p.stat().st_size<4*1024*1024:
                  shutil.copy2(p,target)
          (dst/'source-file-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          SCRIPT
      - uses: actions/upload-artifact@v4
        with:
          name: mv-p0-run2-compact
          path: compact/
