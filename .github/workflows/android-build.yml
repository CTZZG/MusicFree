name: Android Release Build

on:
    workflow_dispatch:
        inputs:
            version_name:
                description: Optional version name for artifact labels
                required: false
                type: string
    push:
        tags:
            - 'v*'
    pull_request:
        types:
            - closed

permissions:
    contents: write

concurrency:
    group: android-build-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-android:
        name: Build Android APK
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
        env:
            NODE_VERSION: '22'
            JAVA_VERSION: '17'
            NODE_ENV: production
            ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure GitHub dependency access
              run: |
                  git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
                  git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: gradle

            - name: Install dependencies
              env:
                  NODE_ENV: development
                  HUSKY: 0
              run: npm ci

            - name: Generate build metadata
              run: |
                  INPUT_VERSION="${{ inputs.version_name }}"
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  APP_VERSION="${INPUT_VERSION:-$PACKAGE_VERSION}"
                  SHORT_SHA="${GITHUB_SHA::7}"
                  BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

                  {
                    echo "APP_VERSION=$APP_VERSION"
                    echo "PACKAGE_VERSION=$PACKAGE_VERSION"
                    echo "SHORT_SHA=$SHORT_SHA"
                    echo "BUILD_DATE=$BUILD_DATE"
                  } >> "$GITHUB_ENV"

                  {
                    echo "App version: $APP_VERSION"
                    echo "Package version: $PACKAGE_VERSION"
                    echo "Commit: $GITHUB_SHA"
                    echo "Short SHA: $SHORT_SHA"
                    echo "Ref: $GITHUB_REF_NAME"
                    echo "Build date: $BUILD_DATE"
                    echo "Node: ${{ env.NODE_VERSION }}"
                    echo "Java: ${{ env.JAVA_VERSION }}"
                  } > android-build-info.txt

            - name: Setup signing key
              if: env.ANDROID_RELEASE_KEYSTORE_BASE64 != ''
              env:
                  ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
                  ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
                  ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
              run: |
                  echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
                  {
                    echo "RELEASE_STORE_FILE=../../release.jks"
                    echo "RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
                    echo "RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
                    echo "RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
                  } > android/keystore.properties

            - name: Validate signing setup
              run: |
                  if [ -f android/keystore.properties ] && [ -f release.jks ]; then
                    echo "Release signing is configured."
                  else
                    echo "Release signing secrets were not provided. Gradle will build unsigned release APKs."
                  fi

            - name: Generate app build info
              run: npm run generate-build-info

            - name: Prepare Gradle
              run: chmod +x ./android/gradlew

            - name: Restore Metro cache
              uses: actions/cache@v5
              with:
                  path: |
                      /tmp/metro-*
                      ~/.metro
                  key: ${{ runner.os }}-metro-${{ hashFiles('package-lock.json', 'metro.config.js', 'babel.config.js') }}
                  restore-keys: |
                      ${{ runner.os }}-metro-

            - name: Build release APKs
              working-directory: ./android
              run: ./gradlew assembleRelease --no-daemon --stacktrace

            - name: Collect APKs
              run: |
                  mkdir -p dist
                  shopt -s nullglob
                  apks=(android/app/build/outputs/apk/release/*.apk)
                  if [ ${#apks[@]} -eq 0 ]; then
                    echo "No release APKs were found."
                    find android/app/build/outputs/apk -type f -name '*.apk' -print || true
                    exit 1
                  fi

                  for apk in "${apks[@]}"; do
                    base="$(basename "$apk" .apk)"
                    cp "$apk" "dist/MusicFree-${APP_VERSION}-${SHORT_SHA}-${base}.apk"
                  done

                  cp android-build-info.txt dist/android-build-info.txt
                  ls -lh dist

            - name: Upload APK artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: MusicFree-Android-${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}
                  path: dist/*
                  if-no-files-found: error

            - name: Clean existing release assets
              if: github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  node <<'NODE'
                  const repo = process.env.GITHUB_REPOSITORY;
                  const tag = `v${process.env.APP_VERSION}`;
                  const headers = {
                    authorization: `Bearer ${process.env.GH_TOKEN}`,
                    accept: 'application/vnd.github+json',
                    'x-github-api-version': '2022-11-28',
                  };

                  async function github(path, options = {}) {
                    const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
                      ...options,
                      headers: {
                        ...headers,
                        ...(options.headers ?? {}),
                      },
                    });
                    if (response.status === 404) {
                      return null;
                    }
                    if (!response.ok) {
                      throw new Error(`${options.method ?? 'GET'} ${path} failed: ${response.status} ${await response.text()}`);
                    }
                    if (response.status === 204) {
                      return null;
                    }
                    return response.json();
                  }

                  const release = await github(`/releases/tags/${encodeURIComponent(tag)}`);
                  if (!release) {
                    console.log(`Release ${tag} does not exist yet.`);
                    process.exit(0);
                  }

                  const apkPrefix = `MusicFree-${process.env.APP_VERSION}-`;
                  for (const asset of release.assets ?? []) {
                    const shouldDelete =
                      asset.name === 'android-build-info.txt' ||
                      (asset.name.startsWith(apkPrefix) && asset.name.endsWith('.apk'));
                    if (shouldDelete) {
                      await github(`/releases/assets/${asset.id}`, {method: 'DELETE'});
                      console.log(`Deleted old release asset: ${asset.name}`);
                    }
                  }
                  NODE

            - name: Publish GitHub release assets
              if: github.event_name != 'pull_request'
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
                  target_commitish: ${{ github.sha }}
                  name: MusicFree ${{ env.APP_VERSION }}
                  body: |
                      Android build for `${{ env.APP_VERSION }}`.

                      - Commit: `${{ github.sha }}`
                      - Ref: `${{ github.ref_name }}`
                      - Build date: `${{ env.BUILD_DATE }}`
                      - Signing: release workflow signing check is recorded in `android-build-info.txt`.
                  files: dist/*
                  generate_release_notes: true
                  prerelease: ${{ contains(env.APP_VERSION, '-') }}
                  make_latest: ${{ contains(env.APP_VERSION, '-') && 'false' || 'true' }}
                  overwrite_files: true
                  fail_on_unmatched_files: true

            - name: Build summary
              run: |
                  {
                    echo "## Android build"
                    echo
                    echo "- App version: ${APP_VERSION}"
                    echo "- Package version: ${PACKAGE_VERSION}"
                    echo "- Commit: ${GITHUB_SHA}"
                    echo "- Build date: ${BUILD_DATE}"
                    echo "- Signing: $([ -f android/keystore.properties ] && echo configured || echo unsigned)"
                    echo
                    echo "### Artifacts"
                    ls -1 dist | sed 's/^/- /'
                  } >> "$GITHUB_STEP_SUMMARY"
