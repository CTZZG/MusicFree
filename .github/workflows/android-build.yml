name: Android Release Build

on:
    workflow_dispatch:
        inputs:
            version_name:
                description: Optional version name for artifact labels
                required: false
                type: string
    push:
        tags:
            - 'v*'
    pull_request:
        types:
            - closed

permissions:
    contents: write

concurrency:
    group: android-build-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-android:
        name: Build Android APK
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
        env:
            NODE_VERSION: '22'
            JAVA_VERSION: '17'
            NODE_ENV: production
            RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
            RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
            RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
            RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
            EXPECTED_RELEASE_CERT_SHA256: d6ff76f4b8d7b43d3e58bca3fa3f9607d364ab13217c35bf63e05df4efbaa1fd
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure GitHub dependency access
              run: |
                  git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
                  git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: gradle

            - name: Install dependencies
              env:
                  NODE_ENV: development
                  HUSKY: 0
              run: npm ci

            - name: Static and regression gates
              env:
                  NODE_ENV: test
              run: |
                  npm run audit:round20-static
                  npm test -- --runInBand
                  node ./node_modules/patch-package/index.js --check
                  npm audit --omit=dev --audit-level=critical --registry=https://registry.npmjs.org
                  git diff --check

            - name: Generate build metadata
              run: |
                  INPUT_VERSION="${{ inputs.version_name }}"
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  APP_VERSION="${INPUT_VERSION:-$PACKAGE_VERSION}"
                  SHORT_SHA="${GITHUB_SHA::7}"
                  BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                  BUILD_REF_NAME="${GITHUB_REF_NAME:-unknown}"
                  BUILD_REF_TYPE="${GITHUB_REF_TYPE:-unknown}"
                  BUILD_RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  if [ "$BUILD_REF_TYPE" = "tag" ] && [ -n "$GITHUB_REF_NAME" ]; then
                    RELEASE_TAG="$GITHUB_REF_NAME"
                  else
                    RELEASE_TAG="v$APP_VERSION"
                  fi

                  {
                    echo "APP_VERSION=$APP_VERSION"
                    echo "PACKAGE_VERSION=$PACKAGE_VERSION"
                    echo "SHORT_SHA=$SHORT_SHA"
                    echo "BUILD_DATE=$BUILD_DATE"
                    echo "BUILD_REF_NAME=$BUILD_REF_NAME"
                    echo "BUILD_REF_TYPE=$BUILD_REF_TYPE"
                    echo "BUILD_RUN_URL=$BUILD_RUN_URL"
                    echo "RELEASE_TAG=$RELEASE_TAG"
                  } >> "$GITHUB_ENV"

                  {
                    echo "App version: $APP_VERSION"
                    echo "Package version: $PACKAGE_VERSION"
                    echo "Commit: $GITHUB_SHA"
                    echo "Short SHA: $SHORT_SHA"
                    echo "Build branch: $BUILD_REF_NAME"
                    echo "Ref type: $BUILD_REF_TYPE"
                    echo "Ref: $GITHUB_REF"
                    echo "Release tag: $RELEASE_TAG"
                    echo "Build date: $BUILD_DATE"
                    echo "Workflow: $GITHUB_WORKFLOW"
                    echo "Run: $BUILD_RUN_URL"
                    echo "Node: ${{ env.NODE_VERSION }}"
                    echo "Java: ${{ env.JAVA_VERSION }}"
                  } > android-build-info.txt

            - name: Setup signing key
              run: |
                  if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
                    if [ "${{ github.event_name }}" != "pull_request" ]; then
                      echo "::error title=Signing configuration missing::Formal release and tag builds require release signing secrets."
                      exit 1
                    fi
                    echo "Signing secrets were not provided for this merged-PR verification build; unsigned artifacts are allowed but will not be published as a release."
                    exit 0
                  fi

                  missing=0
                  for name in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
                    if [ -z "${!name}" ]; then
                      echo "::error::$name is required when a release keystore is provided."
                      missing=1
                    fi
                  done
                  if [ "$missing" -ne 0 ]; then
                    echo "::error title=Signing configuration failed::Release keystore was provided, but one or more required signing secrets are missing."
                    exit 1
                  fi

                  echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
                  {
                    echo "RELEASE_STORE_FILE=../../release.jks"
                    echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
                    echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
                    echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
                  } > android/keystore.properties

            - name: Validate signing setup
              run: |
                  if [ -f android/keystore.properties ] && [ -f release.jks ]; then
                    echo "Release signing is configured."
                    if ! keytool -list \
                      -keystore release.jks \
                      -storepass "$RELEASE_STORE_PASSWORD" \
                      -alias "$RELEASE_KEY_ALIAS" \
                      >/dev/null; then
                      echo "::error title=Signing validation failed::Release signing key validation failed. Check keystore password, key alias, and key password secrets."
                      exit 1
                    fi
                    echo "Release signing key was validated."
                    echo "SIGNING_STATUS=configured" >> "$GITHUB_ENV"
                    echo "SIGNING_VALIDATION=passed" >> "$GITHUB_ENV"
                    {
                      echo "Signing: configured"
                      echo "Signing validation: passed"
                    } >> android-build-info.txt
                  else
                    if [ "${{ github.event_name }}" != "pull_request" ]; then
                      echo "::error title=Signing validation missing::Formal release and tag builds must have a validated signing key."
                      exit 1
                    fi
                    echo "Unsigned merged-PR verification build; GitHub Release publication is disabled for this event."
                    echo "SIGNING_STATUS=unsigned" >> "$GITHUB_ENV"
                    echo "SIGNING_VALIDATION=skipped" >> "$GITHUB_ENV"
                    {
                      echo "Signing: unsigned"
                      echo "Signing validation: skipped"
                    } >> android-build-info.txt
                  fi

            - name: Generate app build info
              run: npm run generate-build-info

            - name: Prepare Gradle
              run: chmod +x ./android/gradlew

            - name: Restore Metro cache
              uses: actions/cache@v5
              with:
                  path: |
                      /tmp/metro-*
                      ~/.metro
                  key: ${{ runner.os }}-metro-${{ hashFiles('package-lock.json', 'metro.config.js', 'babel.config.js') }}
                  restore-keys: |
                      ${{ runner.os }}-metro-

            - name: Build release APKs
              working-directory: ./android
              run: |
                  if ! ./gradlew assembleRelease \
                    --no-daemon \
                    --stacktrace \
                    --max-workers=2 \
                    -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"; then
                    echo "::error title=Android build failed::Gradle assembleRelease failed. Check this step for compiler, bundling, or native build output."
                    exit 1
                  fi

            - name: Collect APKs
              run: |
                  mkdir -p dist
                  shopt -s nullglob
                  apks=(android/app/build/outputs/apk/release/*.apk)
                  if [ ${#apks[@]} -eq 0 ]; then
                    echo "::error title=Build output collection failed::No release APKs were found after assembleRelease."
                    find android/app/build/outputs/apk -type f -name '*.apk' -print || true
                    exit 1
                  fi

                  for apk in "${apks[@]}"; do
                    base="$(basename "$apk" .apk)"
                    cp "$apk" "dist/MusicFree-${APP_VERSION}-${SHORT_SHA}-${base}.apk"
                  done

                  mapping_dir="android/app/build/outputs/mapping/release"
                  if [ -d "$mapping_dir" ]; then
                    tar -czf "dist/MusicFree-${APP_VERSION}-${SHORT_SHA}-mapping.tar.gz" -C "$mapping_dir" .
                  fi

                  cp android-build-info.txt dist/android-build-info.txt
                  (cd dist && sha256sum * > SHA256SUMS.txt)
                  ls -lh dist

            - name: Verify signed release APKs
              if: github.event_name != 'pull_request'
              run: |
                  if [ "${SIGNING_STATUS:-}" != "configured" ] || [ "${SIGNING_VALIDATION:-}" != "passed" ]; then
                    echo "::error title=Release signing gate failed::Signing was not configured and validated."
                    exit 1
                  fi
                  APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
                  if [ -z "$APKSIGNER" ]; then
                    echo "::error title=APK verification unavailable::apksigner was not found in the Android SDK."
                    exit 1
                  fi
                  for apk in dist/*.apk; do
                    verification="$("$APKSIGNER" verify --verbose --print-certs "$apk")"
                    echo "$verification"
                    actual_cert="$(printf '%s\n' "$verification" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
                    if ! [[ "$actual_cert" =~ ^[0-9a-f]{64}$ ]]; then
                      echo "::error title=Release certificate parsing failed::Could not extract a SHA-256 certificate digest from apksigner output for $apk."
                      exit 1
                    fi
                    if [ "$actual_cert" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
                      echo "::error title=Unexpected release certificate::$apk was signed by $actual_cert instead of the pinned certificate."
                      exit 1
                    fi
                  done

            - name: Upload APK artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: MusicFree-Android-${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}
                  path: dist/*
                  if-no-files-found: error

            - name: Clean existing release assets
              if: github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  node <<'NODE'
                  const repo = process.env.GITHUB_REPOSITORY;
                  const tag = process.env.RELEASE_TAG || `v${process.env.APP_VERSION}`;
                  const retryableStatuses = new Set([429, 500, 502, 503, 504]);
                  const headers = {
                    authorization: `Bearer ${process.env.GH_TOKEN}`,
                    accept: 'application/vnd.github+json',
                    'x-github-api-version': '2022-11-28',
                  };

                  class GithubRequestError extends Error {
                    constructor(method, path, status, body) {
                      super(`${method} ${path} failed: ${status} ${body}`);
                      this.status = status;
                    }
                  }

                  function sleep(ms) {
                    return new Promise(resolve => setTimeout(resolve, ms));
                  }

                  async function github(path, options = {}) {
                    const {maxAttempts = 4, ...requestOptions} = options;
                    const method = requestOptions.method ?? 'GET';
                    for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                      const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
                        ...requestOptions,
                        headers: {
                          ...headers,
                          ...(requestOptions.headers ?? {}),
                        },
                      });
                      if (response.status === 404) {
                        return null;
                      }
                      if (response.ok) {
                        if (response.status === 204) {
                          return null;
                        }
                        return response.json();
                      }

                      const body = await response.text();
                      if (!retryableStatuses.has(response.status) || attempt === maxAttempts) {
                        throw new GithubRequestError(method, path, response.status, body);
                      }

                      const retryAfter = Number(response.headers.get('retry-after'));
                      const delayMs = Number.isFinite(retryAfter) && retryAfter > 0
                        ? retryAfter * 1000
                        : attempt * 1500;
                      console.warn(`${method} ${path} failed with ${response.status}; retrying in ${delayMs}ms (${attempt}/${maxAttempts}).`);
                      await sleep(delayMs);
                    }
                  }

                  let release;
                  try {
                    release = await github(`/releases/tags/${encodeURIComponent(tag)}`, {maxAttempts: 5});
                  } catch (error) {
                    if (error instanceof GithubRequestError && retryableStatuses.has(error.status)) {
                      console.warn(`::warning::Could not load release ${tag} after retries. Continuing because cleanup is best-effort.`);
                      process.exit(0);
                    }
                    throw error;
                  }
                  if (!release) {
                    console.log(`Release ${tag} does not exist yet.`);
                    process.exit(0);
                  }

                  const apkPrefix = `MusicFree-${process.env.APP_VERSION}-`;
                  for (const asset of release.assets ?? []) {
                    const shouldDelete =
                      asset.name === 'android-build-info.txt' ||
                      asset.name === 'SHA256SUMS.txt' ||
                      (
                        asset.name.startsWith(apkPrefix) &&
                        (asset.name.endsWith('.apk') || asset.name.endsWith('-mapping.tar.gz'))
                      );
                    if (shouldDelete) {
                      try {
                        await github(`/releases/assets/${asset.id}`, {method: 'DELETE', maxAttempts: 5});
                        console.log(`Deleted old release asset: ${asset.name}`);
                      } catch (error) {
                        if (error instanceof GithubRequestError && retryableStatuses.has(error.status)) {
                          console.warn(`::warning::Could not delete old release asset after retries: ${asset.name}. Continuing because cleanup is best-effort.`);
                          continue;
                        }
                        throw error;
                      }
                    }
                  }
                  NODE

            - name: Publish GitHub release assets
              if: github.event_name != 'pull_request'
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ env.RELEASE_TAG }}
                  target_commitish: ${{ github.sha }}
                  name: MusicFree ${{ env.APP_VERSION }}
                  body: |
                      Android build for `${{ env.APP_VERSION }}`.

                      - Commit: `${{ github.sha }}`
                      - Ref: `${{ env.BUILD_REF_NAME }}`
                      - Build date: `${{ env.BUILD_DATE }}`
                      - Signing: `${{ env.SIGNING_STATUS }}`; details are recorded in `android-build-info.txt`.
                  files: dist/*
                  generate_release_notes: true
                  prerelease: ${{ contains(env.APP_VERSION, '-') }}
                  make_latest: ${{ contains(env.APP_VERSION, '-') && 'false' || 'true' }}
                  overwrite_files: true
                  fail_on_unmatched_files: true

            - name: Build summary
              run: |
                  {
                    echo "## Android build"
                    echo
                    echo "- App version: ${APP_VERSION}"
                    echo "- Package version: ${PACKAGE_VERSION}"
                    echo "- Commit: ${GITHUB_SHA}"
                    echo "- Ref: ${BUILD_REF_NAME} (${BUILD_REF_TYPE})"
                    echo "- Build date: ${BUILD_DATE}"
                    echo "- Run: ${BUILD_RUN_URL}"
                    echo "- Signing: ${SIGNING_STATUS:-unknown}"
                    echo
                    echo "### Artifacts"
                    ls -1 dist | sed 's/^/- /'
                  } >> "$GITHUB_STEP_SUMMARY"
