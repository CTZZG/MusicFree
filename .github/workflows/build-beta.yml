name: Beta 构建

on:
    # push:
    #   branches: [dev]
    #   paths: ['package.json']
    workflow_dispatch:
        inputs:
            force_build:
                description: '强制构建 Beta 版本'
                required: false
                default: 'false'
                type: boolean
            e2e:
                description: '打包后在模拟器上跑自动测试'
                required: false
                default: true
                type: boolean
            e2e_apk_run_id:
                description: '只跑自动测试：填一次 Beta 构建的运行 ID，直接测那次打出的 APK，不重新打包'
                required: false
                default: ''
                type: string
            perf_baseline_apk_run_id:
                description: '仅perf诊断：复用另一运行的旧APK，在同一模拟器按旧/新/旧测冷启动；不重新打包'
                required: false
                default: ''
                type: string
            build_ref:
                description: '对照用：打包这个提交（完整提交号）的代码，自动测试脚本仍用触发的分支。留空打包触发的分支'
                required: false
                default: ''
                type: string
            e2e_suite:
                description: '跑哪些自动测试：all 全部；experience 首页/分享/播放信息及播放页观察；storage 下载/迁移故障；power 锁屏/省电；download-source 备用下载/WMA标签；library 本地音乐库；perf 性能基线（不设门限）；crash 本机崩溃记录'
                required: false
                default: 'all'
                type: choice
                options:
                    - all
                    - experience
                    - storage
                    - download-source
                    - power
                    - library
                    - perf
                    - crash
            e2e_android:
                description: '模拟器的 Android 版本：14 是产品支持的最低版本；17（API 37.0）同时打开后台音频加固（throw），用替身作对照，检查本应用没有被拦下'
                required: false
                default: '14'
                type: choice
                options:
                    - '14'
                    - '17'

jobs:
    check-version:
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        runs-on: ubuntu-latest
        outputs:
            should_build: ${{ steps.version_check.outputs.should_build }}
            version: ${{ steps.version_check.outputs.version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Check version format
              id: version_check
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "Current version: $VERSION"

                  # 检查版本是否符合 -beta.xx 格式
                  if [[ $VERSION =~ -beta\.[0-9]{1,2}$ ]]; then
                    echo "✅ Version matches beta format: $VERSION"
                    echo "should_build=true" >> $GITHUB_OUTPUT
                    echo "version=$VERSION" >> $GITHUB_OUTPUT
                  elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_build }}" == "true" ]]; then
                    echo "🔧 Force build triggered by workflow_dispatch"
                    echo "should_build=true" >> $GITHUB_OUTPUT
                    echo "version=$VERSION" >> $GITHUB_OUTPUT
                  else
                    echo "❌ Version does not match beta format or not forced: $VERSION"
                    echo "should_build=false" >> $GITHUB_OUTPUT
                  fi

    build-beta:
        needs: check-version
        if: needs.check-version.outputs.should_build == 'true' && inputs.e2e_apk_run_id == ''
        runs-on: ubuntu-latest
        env:
            NODE_VERSION: '22'
            JAVA_VERSION: '17'
            NODE_ENV: production
            RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
            RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
            RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
            RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  # 留空时就是触发的分支
                  ref: ${{ inputs.build_ref }}

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  java-version: ${{ env.JAVA_VERSION }}
                  distribution: 'temurin'
                  cache: 'gradle'

            # 与稳定版共用同一个质量门：安装依赖并通过检查后才进入 Android 构建
            - name: Quality gate
              uses: ./.github/actions/quality-gate
              with:
                  node-version: ${{ env.NODE_VERSION }}

            # npm ci 会先删除已有的 node_modules，因此这里只缓存 Gradle
            - name: Cache Gradle dependencies
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                      android/.gradle
                  key: ${{ runner.os }}-rn-${{ hashFiles('package-lock.json', 'android/gradle/wrapper/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-rn-

            - name: Setup Keystore (if secrets available)
              if: env.RELEASE_KEYSTORE_BASE64 != ''
              run: |
                  missing=0
                  for name in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
                    if [ -z "${!name}" ]; then
                      echo "::error::$name is required when a release keystore is provided."
                      missing=1
                    fi
                  done
                  if [ "$missing" -ne 0 ]; then
                    echo "::error title=Signing configuration failed::Release keystore was provided, but one or more required signing secrets are missing."
                    exit 1
                  fi

                  echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
                  cat > android/keystore.properties << EOF
                  RELEASE_STORE_FILE=release.keystore
                  RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}
                  RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}
                  RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}
                  EOF
                  chmod 600 android/keystore.properties android/app/release.keystore

            - name: Validate signing setup
              run: |
                  if [ -f android/keystore.properties ] && [ -f android/app/release.keystore ]; then
                    keytool -list \
                      -keystore android/app/release.keystore \
                      -storepass "$RELEASE_STORE_PASSWORD" \
                      -alias "$RELEASE_KEY_ALIAS" \
                      >/dev/null
                    echo "Release signing key was validated."
                    echo "SIGNING_STATUS=configured" >> "$GITHUB_ENV"
                    echo "SIGNING_VALIDATION=passed" >> "$GITHUB_ENV"
                  else
                    echo "Release signing secrets were not provided. This Beta workflow will publish explicitly labelled unsigned test artifacts only."
                    echo "SIGNING_STATUS=unsigned" >> "$GITHUB_ENV"
                    echo "SIGNING_VALIDATION=skipped" >> "$GITHUB_ENV"
                  fi

            - name: Generate build metadata
              run: |
                  # 打包的源码提交。指定 build_ref 时是那个提交，不是触发工作流的提交（GITHUB_SHA）；
                  # APK 文件名、构建信息、应用里的“构建信息”都记它，版本号也按它的 package.json
                  SOURCE_SHA="$(git rev-parse HEAD)"
                  APP_VERSION="${{ needs.check-version.outputs.version }}"
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  if [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
                    APP_VERSION="$PACKAGE_VERSION"
                  fi
                  SHORT_SHA="${SOURCE_SHA::7}"
                  BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                  BUILD_REF_NAME="${GITHUB_REF_NAME:-unknown}"
                  BUILD_REF_TYPE="${GITHUB_REF_TYPE:-unknown}"
                  BUILD_RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

                  {
                    echo "BUILD_SOURCE_SHA=$SOURCE_SHA"
                    echo "APP_VERSION=$APP_VERSION"
                    echo "PACKAGE_VERSION=$PACKAGE_VERSION"
                    echo "SHORT_SHA=$SHORT_SHA"
                    echo "BUILD_DATE=$BUILD_DATE"
                    echo "BUILD_REF_NAME=$BUILD_REF_NAME"
                    echo "BUILD_REF_TYPE=$BUILD_REF_TYPE"
                    echo "BUILD_RUN_URL=$BUILD_RUN_URL"
                  } >> "$GITHUB_ENV"

                  {
                    echo "App version: $APP_VERSION"
                    echo "Package version: $PACKAGE_VERSION"
                    echo "Commit: $SOURCE_SHA"
                    echo "Short SHA: $SHORT_SHA"
                    if [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
                      echo "Workflow commit: $GITHUB_SHA"
                    fi
                    echo "Build branch: $BUILD_REF_NAME"
                    echo "Ref type: $BUILD_REF_TYPE"
                    echo "Ref: $GITHUB_REF"
                    echo "Build date: $BUILD_DATE"
                    echo "Workflow: $GITHUB_WORKFLOW"
                    echo "Run: $BUILD_RUN_URL"
                    echo "Node: ${{ env.NODE_VERSION }}"
                    echo "Java: ${{ env.JAVA_VERSION }}"
                    echo "Signing: ${SIGNING_STATUS:-unknown}"
                    echo "Signing validation: ${SIGNING_VALIDATION:-unknown}"
                  } > android-build-info.txt

            - name: Generate app build info
              # 指定 build_ref 时跑的是那个提交里的生成器，旧的只认 GITHUB_SHA：把打包的源码提交按它传进去
              run: GITHUB_SHA="$BUILD_SOURCE_SHA" npm run generate-build-info

            - name: Make gradlew executable
              run: chmod +x android/gradlew

            # 原生单元测试先跑：失败就不再打包，也不会上传 APK
            - name: Android unit tests
              run: |
                  cd android
                  ./gradlew testReleaseUnitTest \
                    --no-daemon \
                    --stacktrace \
                    --max-workers=2 \
                    -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"

            # 测试失败时也上传报告，方便直接看是哪个用例
            - name: Upload Android unit test reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: android-unit-tests-beta-${{ github.run_id }}
                  path: |
                      android/app/build/reports/tests/
                      android/app/build/test-results/
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Build Beta APK
              run: |
                  cd android
                  ./gradlew assembleRelease \
                    --no-daemon \
                    --stacktrace \
                    --max-workers=2 \
                    -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"

            - name: Collect Beta APKs
              run: |
                  mkdir -p dist
                  shopt -s nullglob
                  apks=(android/app/build/outputs/apk/release/*.apk)
                  if [ ${#apks[@]} -eq 0 ]; then
                    echo "::error title=Build output collection failed::No release APKs were found after assembleRelease."
                    find android/app/build/outputs/apk -type f -name '*.apk' -print || true
                    exit 1
                  fi

                  for apk in "${apks[@]}"; do
                    base="$(basename "$apk" .apk)"
                    if [ "${SIGNING_STATUS:-unsigned}" = "unsigned" ]; then
                      cp "$apk" "dist/MusicFree-${APP_VERSION}-${SHORT_SHA}-UNSIGNED-TEST-ONLY-${base}.apk"
                    else
                      cp "$apk" "dist/MusicFree-${APP_VERSION}-${SHORT_SHA}-${base}.apk"
                    fi
                  done

                  mapping_dir="android/app/build/outputs/mapping/release"
                  if [ -d "$mapping_dir" ]; then
                    tar -czf "dist/MusicFree-${APP_VERSION}-${SHORT_SHA}-mapping.tar.gz" -C "$mapping_dir" .
                  fi

                  cp android-build-info.txt dist/android-build-info.txt
                  (cd dist && sha256sum * > SHA256SUMS.txt)
                  ls -lh dist

            - name: Verify APK packaging
              run: |
                  if [ ! -f generator/audit-apk-packaging.py ] && [ "$BUILD_SOURCE_SHA" != "$GITHUB_SHA" ]; then
                    echo "APK packaging audit is absent in the requested older source commit; no audit result is claimed."
                  else
                    python3 -I generator/audit-apk-packaging.py dist/*.apk --output android/app/build/reports/apk-packaging.json
                  fi

            - name: Upload APK packaging report
              uses: actions/upload-artifact@v7
              with:
                  name: apk-packaging-beta-${{ github.run_id }}
                  path: android/app/build/reports/apk-packaging.json
                  if-no-files-found: ignore

            - name: Verify Release tagging reflection and legacy formats
              run: |
                  if [ ! -f generator/check-tagging-release.py ] && [ "$BUILD_SOURCE_SHA" != "$GITHUB_SHA" ]; then
                    echo "Tagging audit is absent in the requested older source commit; no audit result is claimed."
                  else
                    if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
                      sudo apt-get update
                      sudo apt-get install -y ffmpeg
                    fi
                    python3 -I generator/check-tagging-release.py dist/*.apk --output android/app/build/reports/tagging-release.json
                  fi

            - name: Upload Release tagging report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: tagging-release-beta-${{ github.run_id }}
                  path: android/app/build/reports/tagging-release.json
                  if-no-files-found: ignore

            - name: Upload Beta APKs
              uses: actions/upload-artifact@v7
              with:
                  name: beta-apks-${{ env.APP_VERSION }}-${{ env.SIGNING_STATUS }}
                  path: dist/*
                  if-no-files-found: error
                  retention-days: 30

            - name: Build Summary
              run: |
                  {
                    echo "## Beta build"
                    echo
                    echo "- App version: ${APP_VERSION}"
                    echo "- Package version: ${PACKAGE_VERSION}"
                    echo "- Commit: ${BUILD_SOURCE_SHA}"
                    if [ "$BUILD_SOURCE_SHA" != "$GITHUB_SHA" ]; then
                      echo "- Workflow commit: ${GITHUB_SHA} (build_ref)"
                    fi
                    echo "- Ref: ${BUILD_REF_NAME} (${BUILD_REF_TYPE})"
                    echo "- Build date: ${BUILD_DATE}"
                    echo "- Signing: ${SIGNING_STATUS:-unknown}"
                    echo "- Triggered by: ${{ github.event_name }}"
                    echo "- Actor: ${{ github.actor }}"
                    echo
                    echo "### Artifacts"
                    ls -1 dist | sed 's/^/- /'
                  } >> "$GITHUB_STEP_SUMMARY"

    # 在 Android 模拟器上装刚打出的 APK（默认 x86_64），跑 e2e/ 里的端到端测试（说明见 e2e/README.md）
    e2e:
        name: Emulator E2E
        needs: [check-version, build-beta]
        if: >-
            !cancelled() && inputs.e2e &&
            (needs.build-beta.result == 'success' || inputs.e2e_apk_run_id != '')
        # Android 17（android-37.0）镜像在 ubuntu-24.04 主机上，SurfaceFlinger 每隔几十秒就在
        # GoldfishMapper::readFromHost 断言 hasReadColorBufferDma 失败退出，系统框架跟着重启（Beta #196）；
        # 别的项目报告同样的模拟器在 ubuntu-26.04 主机上不出现。Android 14 仍用 ubuntu-latest
        runs-on: ${{ inputs.e2e_android == '17' && 'ubuntu-26.04' || 'ubuntu-latest' }}
        timeout-minutes: 60
        permissions:
            # 下载别的运行里的 APK；把截图推到 refs/e2e/latest
            actions: read
            contents: write
        env:
            MAESTRO_VERSION: '2.8.0'
            MAESTRO_CLI_NO_ANALYTICS: '1'
            MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Download the APK built by this run
              if: inputs.e2e_apk_run_id == ''
              uses: actions/download-artifact@v8
              with:
                  pattern: beta-apks-*
                  path: apk
                  merge-multiple: true

            - name: Download the APK built by run ${{ inputs.e2e_apk_run_id }}
              if: inputs.e2e_apk_run_id != ''
              uses: actions/download-artifact@v8
              with:
                  pattern: beta-apks-*
                  path: apk
                  merge-multiple: true
                  run-id: ${{ inputs.e2e_apk_run_id }}
                  github-token: ${{ github.token }}

            - name: Pick the x86_64 APK for the emulator
              run: |
                  shopt -s nullglob
                  apks=(apk/*x86_64-release.apk)
                  if [ ${#apks[@]} -ne 1 ]; then
                    echo "::error title=E2E::Expected one x86_64 APK, found ${#apks[@]}."
                    ls -l apk || true
                    exit 1
                  fi
                  echo "E2E_APK=${apks[0]}" >> "$GITHUB_ENV"
                  echo "Testing ${apks[0]}"
                  # 这个 APK 打包的源码提交（和 APK 一起上传的构建信息里的 Commit），写进测试结果
                  commit=$(sed -n 's/^Commit: //p' apk/android-build-info.txt 2>/dev/null | head -n 1)
                  echo "E2E_APK_COMMIT=${commit}" >> "$GITHUB_ENV"
                  echo "APK source commit: ${commit:-unknown}"

            - name: Download cold-start comparison baseline
              if: inputs.perf_baseline_apk_run_id != ''
              uses: actions/download-artifact@v8
              with:
                  pattern: beta-apks-*
                  path: baseline-apk
                  merge-multiple: true
                  run-id: ${{ inputs.perf_baseline_apk_run_id }}
                  github-token: ${{ github.token }}

            - name: Validate cold-start comparison inputs
              if: inputs.perf_baseline_apk_run_id != ''
              env:
                  SELECTED_SUITE: ${{ inputs.e2e_suite }}
              run: |
                  test "$SELECTED_SUITE" = perf
                  shopt -s nullglob
                  apks=(baseline-apk/*x86_64-release.apk)
                  test ${#apks[@]} -eq 1
                  echo "E2E_PERF_BASELINE_APK=${apks[0]}" >> "$GITHUB_ENV"
                  commit=$(sed -n 's/^Commit: //p' baseline-apk/android-build-info.txt | head -n 1)
                  [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$E2E_APK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
                  test "$commit" != "$E2E_APK_COMMIT"
                  echo "E2E_PERF_BASELINE_COMMIT=${commit}" >> "$GITHUB_ENV"

            - name: Install audio file validation tools
              run: |
                  if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
                    sudo apt-get update
                    sudo apt-get install -y ffmpeg
                  fi

            - name: Self-test E2E helpers
              run: |
                  python3 -I e2e/lib/media_session.py --self-test
                  python3 -I e2e/lib/dock.py --self-test
                  python3 -I e2e/lib/audio_focus.py --self-test
                  python3 -I e2e/lib/kvstore.py --self-test
                  python3 -I e2e/lib/local_library.py --self-test
                  python3 -I e2e/lib/perf_stats.py --self-test
                  python3 -I e2e/lib/device_state.py --self-test
                  bash e2e/lib/pause_checks_test.sh
                  bash e2e/lib/download_source_test.sh
                  bash e2e/lib/tagging_test.sh
                  python3 -I e2e/lib/share_card.py --self-test
                  python3 -I e2e/lib/share_receiver.py --self-test
                  python3 -I e2e/lib/playback_info_evidence.py --self-test
                  bash e2e/lib/experience_test.sh
                  bash e2e/lib/share_receiver_test.sh
                  bash e2e/lib/plugin_install_test.sh
                  python3 -I e2e/lib/song_target_test.py
                  python3 -I e2e/lib/perf_compare_test.py
                  bash e2e/lib/storage_checks_test.sh
                  bash e2e/lib/power_checks_test.sh
                  bash e2e/lib/power_environment_test.sh
                  bash e2e/lib/power_controls_test.sh
                  bash e2e/lib/power_scenario_test.sh
                  bash e2e/lib/crash_checks_test.sh
                  bash e2e/lib/audio_hardening_test.sh

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  java-version: '17'
                  distribution: 'temurin'

            # 端到端第 16 步用的“视频”替身：像视频应用一样占用音频焦点（见 e2e/focus-app），第 19 步验证锁屏时的临时焦点打断。
            # 打不出来也接着跑其他检查，这两步会逐项记失败
            - name: Build the video stand-in
              continue-on-error: true
              run: |
                  bash e2e/focus-app/build.sh "$RUNNER_TEMP/e2e-focus.apk"
                  echo "E2E_FOCUS_APK=$RUNNER_TEMP/e2e-focus.apk" >> "$GITHUB_ENV"

            - name: Build the independent share receiver
              if: inputs.e2e_suite == 'all' || inputs.e2e_suite == 'experience'
              run: |
                  bash e2e/share-receiver/build.sh "$RUNNER_TEMP/e2e-share.apk"
                  echo "E2E_SHARE_RECEIVER_APK=$RUNNER_TEMP/e2e-share.apk" >> "$GITHUB_ENV"

            # 端到端第 18 步：从 0.7.3（MMKV 时代的最后一版）覆盖安装。下载它的 x86_64 APK（核对 SHA-256），
            # 编出往它的 MMKV 写测试数据的 mmkv-seed（见 e2e/mmkv-seed）。准备不好也接着跑其他检查，
            # 第 18 步会逐项记失败
            - name: Prepare the 0.7.3 upgrade test
              continue-on-error: true
              env:
                  LEGACY_APK_URL: https://github.com/CTZZG/MusicFree/releases/download/v0.7.3/MusicFree-0.7.3-c35e6ba-app-x86_64-release.apk
                  LEGACY_APK_SHA256: 945708e24c651158ac7607eedaa97d6e1e5f9d5a4057d9ed896d37ea037de5c6
              run: |
                  curl -fsSL --retry 3 -o "$RUNNER_TEMP/legacy-0.7.3.apk" "$LEGACY_APK_URL"
                  echo "$LEGACY_APK_SHA256  $RUNNER_TEMP/legacy-0.7.3.apk" | sha256sum -c -
                  bash e2e/mmkv-seed/build.sh "$RUNNER_TEMP/mmkv-seed"
                  echo "E2E_LEGACY_APK=$RUNNER_TEMP/legacy-0.7.3.apk" >> "$GITHUB_ENV"
                  echo "E2E_MMKV_SEED=$RUNNER_TEMP/mmkv-seed" >> "$GITHUB_ENV"

            - name: Install Maestro
              run: |
                  curl -fsSL "https://get.maestro.mobile.dev" | bash
                  echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
                  "$HOME/.maestro/bin/maestro" --version

            # 不加 -noaudio：mpv 要有音频输出才会往前播
            - name: Run E2E on the emulator
              uses: reactivecircus/android-emulator-runner@v2
              env:
                  E2E_SUITE: ${{ inputs.e2e_suite || 'all' }}
                  E2E_AUDIO_HARDENING: ${{ inputs.e2e_android == '17' && 'throw' || '' }}
                  # 测的 APK 不是按这次的提交打包时，写进结果
                  E2E_APK_SOURCE: ${{ inputs.e2e_apk_run_id != '' && format('Beta 运行 {0} 打出的 APK', inputs.e2e_apk_run_id) || (inputs.build_ref != '' && format('按提交 {0} 打包的 APK', inputs.build_ref) || '') }}
              with:
                  # 默认用产品支持的最低版本 Android 14；Android 16 另有原生仪器测试。
                  # Android 17 的镜像和平台包都叫 android-37.0（SDK 仓库里没有不带小版本号的 android-37）
                  api-level: ${{ inputs.e2e_android == '17' && '37.0' || '34' }}
                  target: google_apis
                  arch: x86_64
                  profile: pixel_6
                  cores: 3
                  ram-size: 4096M
                  # Android 17 镜像默认的数据分区装不下应用和替身（INSTALL_FAILED_INSUFFICIENT_STORAGE），
                  # 只给它加大；留空是默认大小
                  disk-size: ${{ inputs.e2e_android == '17' && '8G' || '' }}
                  # Experience starts at 1x before the app/ReactHost is created;
                  # its observer records 1x/0x boundaries and restores settings.
                  disable-animations: ${{ inputs.e2e_suite != 'experience' }}
                  emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
                  script: >-
                      if [ -n "${E2E_PERF_BASELINE_APK:-}" ]; then bash e2e/perf-cold-compare.sh "$E2E_PERF_BASELINE_APK" "$E2E_APK" "$GITHUB_SHA" e2e-results; else bash e2e/run.sh "$E2E_APK" "$GITHUB_SHA" e2e-results; fi

            - name: E2E summary
              if: always()
              run: |
                  if [ -f e2e-results/summary.md ]; then
                    cat e2e-results/summary.md >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload E2E results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-results-${{ github.run_id }}
                  path: e2e-results
                  if-no-files-found: ignore
                  retention-days: 14

            # 截图和结果另外推到一个不显示在分支列表里的引用（每次覆盖），
            # 不用下载 Actions 附件也能取到：git fetch origin refs/e2e/latest
            - name: Publish screenshots to refs/e2e/latest
              if: always() && hashFiles('e2e-results/summary.md') != ''
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  publish_dir="$(mktemp -d)"
                  mkdir -p "$publish_dir/screens"
                  cp e2e-results/summary.md e2e-results/results.tsv "$publish_dir/"
                  # 性能基线的原始数据（只有 e2e_suite=perf 时有）
                  for extra in perf.md perf.jsonl perf-summary.json; do
                    if [ -f "e2e-results/$extra" ]; then cp "e2e-results/$extra" "$publish_dir/"; fi
                  done
                  find e2e-results -name '*.png' -exec cp {} "$publish_dir/screens/" \;
                  cd "$publish_dir"
                  git init -q
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -q -m "E2E results for ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
                  git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/e2e/latest
