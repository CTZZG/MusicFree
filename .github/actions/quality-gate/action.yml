name: Quality gate
description: >-
    稳定版、Beta 与 PR 检查共用的依赖安装和基础质量门：
    npm ci、静态审计与 TypeScript、ESLint（报错与按规则的警告基线）、Jest、布局测试、补丁重放和空白检查。
    检查清单见 generator/verify.mjs，本地用 npm run verify 运行同一套检查。

inputs:
    node-version:
        description: Node.js 版本
        required: false
        default: '22'
    production-audit:
        description: >-
            是否运行生产依赖审计（npm run audit:production-deps）。PR 检查和稳定版构建都打开，
            用同一个步骤和同一份锁文件，有新的高危公告时合并前就失败；Beta 测试构建不打开。
        required: false
        default: 'false'

runs:
    using: composite
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
              node-version: ${{ inputs.node-version }}
              cache: npm
              cache-dependency-path: package-lock.json

        - name: Install dependencies
          shell: bash
          env:
              NODE_ENV: development
              HUSKY: '0'
          run: npm ci --no-audit --no-fund

        - name: Verify (static audits, TypeScript, ESLint, Jest, layout tests, patches)
          shell: bash
          run: npm run verify

        - name: Check bundled mpv startup-delay guard and payload
          shell: bash
          run: |
              bash native/mpv/test-latency.sh
              python3 -I native/mpv/check-short-read.py
              python3 -I native/mpv/verify-bundle.py
              python3 -I native/mpv/check-seek-clock.py --self-test

        - name: Check screens native listener ownership and concurrent initialization
          shell: bash
          run: python3 -I generator/check-rnscreens-listener.py

        - name: Self-test the APK packaging audit (DEX compression, 16 KB native alignment)
          shell: bash
          run: python3 -I generator/audit-apk-packaging.py --self-test

        - name: Whitespace check
          shell: bash
          run: git diff --check

        # 生产依赖不能有高危公告；只放行 generator/audit-production-deps.mjs 中登记过、
        # 上游暂无修复的公告。放在最后，失败时其余检查的结果照常可见。
        - name: Production dependency audit
          if: inputs.production-audit == 'true'
          shell: bash
          run: npm run audit:production-deps
