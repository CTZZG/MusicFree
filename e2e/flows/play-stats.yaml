# 设置 → 基本设置 → 开发选项 → 播放统计：前面换源成功一次（Fallback）、失败两次（Broken、Live Only）
appId: fun.upup.musicfree
---
# 再点一首能播的歌，失败提示随之消失，不挡住设置页
- tapOn: "E2E Tone A"
- tapOn: "设置"
- tapOn: "基本设置"
- scrollUntilVisible:
    element: "播放统计"
    direction: DOWN
    timeout: 30000
- tapOn: "播放统计"
- extendedWaitUntil:
    visible: "(?s).*E2E 测试源 A：\\d+ 次，正常播放 \\d+，换源播放 1，失败 2.*"
    timeout: 15000
- assertVisible: "(?s).*换到 E2E 测试源 B：1 次.*"
- takeScreenshot: 11-play-stats
